[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cod-sentinel"
description = "Risk-to-action economic decision engine for COD orders"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "COD Sentinel" }]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "cod_sentinel.versioning.PROJECT_VERSION" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
