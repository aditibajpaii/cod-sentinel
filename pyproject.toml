[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cod-sentinel"
description = "Risk-to-action economic decision engine for COD orders"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "COD Sentinel" }]
dynamic = ["version"]
dependencies = [
  "altair>=5,<7",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<9",
]
viz = [
  "matplotlib>=3.9,<4",
]
agent = [
  "anthropic>=0.49",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "cod_sentinel.versioning.PROJECT_VERSION" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: live API smoke tests requiring credentials",
]
